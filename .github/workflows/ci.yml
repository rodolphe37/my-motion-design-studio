name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a superseded run (e.g. a second push to the same PR) instead of
# letting both run to completion — saves Actions minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: this workflow only reads the repo, it never
# writes back to it (no auto-commits, no release publishing).
permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches the "node" range in package.json's "engines" field
        # (^22 || >=24) — the latest 22.x and 24.x satisfy it.
        node-version: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest

    # Attendre que toute la matrice CI soit verte
    needs: test

    # Ne déployer que sur un push vers main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Netlify Build
        run: |
          curl -X POST "${{ secrets.NETLIFY_BUILD_HOOK }}"